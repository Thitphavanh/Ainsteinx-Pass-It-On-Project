const bgTex = ctex(16, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0d1630'); gr.addColorStop(0.6, '#070a14'); gr.addColorStop(1, '#03040a'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
const ALL = [goG, cosmos, room, term, photos, nn, perc, gpu];
const composer = new EffectComposer(renderer); composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, {focus: 4.0, aperture: 0.002, maxblur: 0.008}); composer.addPass(bokeh);
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.4, 0.5, 0.9); composer.addPass(bloom);
composer.addPass(new OutputPass());
function dof(ap) { bokeh.enabled = true; bokeh.uniforms.focus.value = camFocus; bokeh.uniforms.aperture.value = ap; bokeh.uniforms.maxblur.value = 0.009; }
function only(list, bg = 'grad') { bokeh.enabled = false; bloom.strength = 0.4; for (const o of ALL) o.visible = list.includes(o); scene.background = bg === 'grad' ? bgTex : new THREE.Color(bg); renderer.toneMappingExposure = 1.0; hemi.intensity = 0.4; key.intensity = 2.2; key.visible = true; rim.intensity = 0; lampLight.intensity = 0; lampLight.visible = false; termGlow.intensity = 0; termGlow.visible = false; scene.environment = envRoom; }

// ---------- Go helpers ----------
const HOOK_MOVE = 61; // stones on board in the hook
function goScene(t, u, nStones, moveIdx, armT, game = 0) { only([goG], 'grad'); keyAt([0, 0, 0], [-0.45, -0.55, 0.75], 3.5, 2.0, 0xfff2e0); hemi.intensity = 0.25; rim.intensity = 1.0; renderer.toneMappingExposure = 0.82;
  setStones(game, nStones); const mv = GAMES[game % GAMES.length][moveIdx]; const P = gp(...mv);
  // armT: 0 hover high above target, 1 placed
  const hover = [P[0] * 0.8, P[1] * 0.6 + 0.3, P[2] + 0.55]; const k = ease(clamp(armT)); const tp = [lerp(hover[0], P[0], k), lerp(hover[1], P[1], k), lerp(hover[2], P[2], k)];
  armReach(tp, armT > 0.98 ? 1 : 0, armT <= 0.98); if (armT > 0.98) { setStones(game, nStones + 1); }
  return P; }

// ---------- scenes ----------
const SCENES = {
  // 0 hook — robot arm places a black stone on a real Go board
  hook(t, u) { const at = prog(u, 0.25, 0.8); const P = goScene(t, u, HOOK_MOVE, HOOK_MOVE, at < 1 ? at : 1.0);
    setCam(sph(lerp(4.4, 3.7, ease(u)), -66 + 10 * u, 40, [0.1, 0.35, 0.3]), [0.1, 0.45, 0.45], 40); dof(0.002);
    return {stone: proj(P), board: proj([0, -0.9, 0.25])}; },
  // 1 more positions than atoms — pull back into the cosmos, atom in foreground
  cosmos(t, u) { only([cosmos], 0x01020a); scene.environment = null; hemi.intensity = 0.25; keyAt([0, 0, 0], [0.4, -0.8, 0.5], 2, 2.2); bloom.strength = 0.9;
    atom.rotation.z = t * 0.3; orbits.forEach(([g, e, ph]) => { const a = t * 2.4 + ph; e.position.set(Math.cos(a), Math.sin(a) * 0.42, 0); }); galaxy.rotation.z = 0.3 + t * 0.02;
    atom.position.set(0, 0, 0); setCam(sph(lerp(3.6, 4.6, ease(u)), -90 + 14 * u, 10, [0, 0, 0]), [0, 4 * ease(u), 0.2 + 1.2 * ease(u)], 40);
    return {atom: proj([0, 0, 0]), galaxy: proj(galaxy.position)}; },
  // 2 nobody can teach every move — top view, stones fill the board fast
  learn(t, u) { const n = Math.floor(lerp(HOOK_MOVE + 1, 180, ease(prog(u, 0.0, 0.95)))); goScene(t, u, n, n, 0.3 + 0.7 * ((t * 2.2) % 1) * 0, 1); arm.visible = true; armReach([0.5, 1.0, 0.9], 0, true);
    setCam(sph(lerp(4.4, 3.8, ease(u)), -90 + 20 * u, 58, [0, 0, 0.22]), [0, 0.25, 0.22], 40); dof(0.0015); return {board: proj([0, 0, 0.25])}; },
  // 3 AI = artificial intelligence — neural net glowing (calm)
  brain(t, u) { only([nn], 'grad'); keyAt([0, 0, 1], [-0.4, -0.6, 0.7], 3, 1.6); bloom.strength = 0.7; nnPulse(t, u, 'fwd');
    setCam(sph(lerp(6.4, 5.6, ease(u)), -100 + 10 * u, 10, [0, 0, 1.55]), [0, 0, 1.55], 40); return {net: proj([0, 0, 2.5])}; },
  // 4 1956 Dartmouth — classroom blackboard
  y1956(t, u) { only([room], 0x15120f); hemi.intensity = 0.3; keyAt([0, 0.5, 1], [-0.3, -0.7, 0.6], 3, 1.6, 0xffe6c8); lampLight.visible = true; lampLight.intensity = 6; renderer.toneMappingExposure = 1.05;
    setCam([lerp(-1.3, 1.2, ease(u)), -4.8 + 0.3 * ease(u), 1.5], [lerp(-0.9, 1.05, ease(u)), 1.5, 1.45], 40); dof(0.0012); return {yr: proj([1.3, 1.55, 2.28]), bb: proj([0, 1.55, 2.6])}; },
  // 5 normal computers follow rules
  rules(t, u) { only([term], 0x07080c); hemi.intensity = 0.15; keyAt([0, 0, 1], [-0.4, -0.7, 0.6], 3, 0.9); drawTerm(t, u); bloom.strength = 0.5; renderer.toneMappingExposure = 0.85;
    setCam(sph(lerp(3.4, 2.8, ease(u)), -96 + 8 * u, 6, [0, -0.2, 0.95]), [0, -0.2, 0.92], 40); dof(0.002); return {scr: proj([0, -0.2, 1.45])}; },
  // 6 learns from examples — cat photos stream into the network
  cats(t, u) { only([photos, nn], 'grad'); keyAt([0, 0, 1], [-0.4, -0.6, 0.7], 4, 2.2); bloom.strength = 0.6; nnPulse(t, u, 'fwd'); nn.position.set(1.6, 0, 0); nn.scale.setScalar(0.8);
    tiles.forEach((m, i) => { const ph = (i / tiles.length + t * 0.12) % 1; const k = ph; const row = (i % 4) - 1.5; m.position.set(lerp(-3.2, 0.9, k), -0.2 + (i % 3) * 0.15, 1.6 + row * 0.55 * (1 - k * 0.8) + Math.sin(t + i) * 0.05); m.rotation.set(0, 0, 0.15 * Math.sin(i + t * 0.5)); const s = k > 0.85 ? (1 - k) / 0.15 : Math.min(1, k / 0.05); m.scale.setScalar(Math.max(0.001, s)); });
    setCam(sph(lerp(7.0, 6.2, ease(u)), -100 + 8 * u, 8, [-0.4, 0, 1.55]), [-0.4, 0, 1.55], 40);
    const r = {net: proj([1.6, 0, 2.7]), photo: proj([-1.6, 0, 2.4])}; return r; },
  // 7 artificial neural network
  net(t, u) { only([nn], 'grad'); nn.position.set(0, 0, 0); nn.scale.setScalar(1); keyAt([0, 0, 1], [-0.4, -0.6, 0.7], 3, 1.6); bloom.strength = 0.8; nnPulse(t, u, 'fwd');
    setCam(sph(lerp(5.0, 4.4, ease(u)), -75 + 25 * u, 14, [0, 0, 1.55]), [0, 0, 1.55], 40); return {net: proj([0, 0, 2.75]), out: proj(nodes[4][0].position)}; },
  // 8 wrong -> adjust -> right (backprop)
  fix(t, u) { only([nn], 'grad'); nn.position.set(0, 0, 0); nn.scale.setScalar(1); keyAt([0, 0, 1], [-0.4, -0.6, 0.7], 3, 1.6); bloom.strength = 0.85; nnPulse(t, u, 'fix');
    setCam(sph(lerp(4.6, 4.2, ease(u)), -95 + 8 * u, 10, [0.3, 0, 1.55]), [0.3, 0, 1.55], 40);
    const o0 = nodes[4][0].position, o1 = nodes[4][1].position; return {o0: proj([o0.x, o0.y, o0.z]), o1: proj([o1.x, o1.y, o1.z]), net: proj([0, 0, 2.75])}; },
  // 9 1958 perceptron sorts punch cards left/right
  perc(t, u) { only([perc], 0x1a1c20); hemi.intensity = 0.35; keyAt([0, 0, 1], [-0.3, -0.7, 0.65], 4, 2.0, 0xfff0dc); renderer.toneMappingExposure = 1.05; bloom.strength = 0.5;
    lights.forEach((b, i) => b.material.emissiveIntensity = (Math.sin(t * 7 + i * 1.7) > 0.2) ? 1.6 : 0.1);
    const cyc = 0.9; pcards.forEach((m, i) => { const ph = (t / cyc - i * 1.0 / pcards.length * 6); const k = ph - Math.floor(ph); const cyc_i = Math.floor(ph); const side = m.userData.side; const tray = side < 0 ? trays[0] : trays[1];
      // feeder -> under eye -> slide to tray -> stack
      const A = [1.05, 0.05, 1.1], B = [1.05, -0.12, 0.84], C = [tray.position.x, tray.position.y, 0.885 + (i % 6) * 0.004];
      let p; if (k < 0.35) p = A.map((a, j) => lerp(a, B[j], ease(k / 0.35))); else p = B.map((b, j) => lerp(b, C[j], ease((k - 0.35) / 0.65)));
      m.position.set(...p); m.rotation.set(0, 0, side * 0.1 * prog(k, 0.35, 1)); m.visible = ph >= 0; });
    setCam(sph(lerp(5.4, 4.8, ease(u)), -72 + 10 * u, 26, [0.2, -0.2, 1.0]), [-0.1, -0.1, 1.15], 40); dof(0.0012);
    return {cab: proj([-1.5, -0.1, 2.35]), trayL: proj([0.35, -0.35, 0.95]), trayR: proj([1.75, -0.35, 0.95])}; },
  // 10 2012 AlexNet — GPU + wall of images
  gpu(t, u) { only([gpu, photos], 0x05070c); scene.environment = envRoom; hemi.intensity = 0.25; keyAt([0, 0, 0.8], [-0.4, -0.6, 0.7], 3, 2.2); rim.intensity = 2.0; bloom.strength = 0.7; fans.forEach(b => b.rotation.z = t * 9);
    tiles.forEach((m, i) => { const c = i % 8, r = Math.floor(i / 8); const k = (t * 0.25 + i * 0.13) % 1; m.position.set(-2.1 + c * 0.6, 1.9, 0.5 + r * 0.6); m.rotation.set(0, 0, 0); m.scale.setScalar(Math.min(1, prog(u, 0, 0.6) * 3 - (i % 5) * 0.3 + 0.3)); });
    setCam(sph(lerp(4.6, 4.0, ease(u)), -96 + 16 * u, 42, [0, 0, 0.8]), [0, 0.5, 1.05], 40); dof(0.0012); return {gpu: proj([0, 0, 1.2]), wall: proj([0, 1.9, 2.0])}; },
  // 11 AlphaGo: learned from human games, then played itself thousands of times — boards cycling fast
  self(t, u) { const per = 1.4; const g = Math.floor(t / per), k = (t / per) % 1; const n = Math.floor(lerp(4, 190, ease(k))); goScene(t, u, n, n, ((t * 4) % 1), g + 2);
    setCam(sph(lerp(4.0, 3.5, ease(u)), -120 + 30 * u, 44, [0, 0.1, 0.22]), [0, 0.3, 0.35], 40); dof(0.0018); return {board: proj([0, 0, 0.3]), game: g}; },
  // 12-13 CTA — calm board, half game
  cta(t, u) { const P = goScene(t, u, 90, 90, 0.4 + 0.2 * Math.sin(t * 0.8), 0); setCam(sph(4.8, -80 + 14 * u, 34, [0.1, 0.4, 0.2]), [0.1, 0.6, 0.55], 40); dof(0.0015); return {stone: proj(P)}; },
};
window.renderFrame = (j) => { const info = SCENES[j.scene](j.t, j.u) || {}; composer.render(); return {img: renderer.domElement.toDataURL('image/jpeg', 0.92), info}; };
window.ready = true;
</script></body></html>
