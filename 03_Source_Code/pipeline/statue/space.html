// ---------- star field (two layers + milky band) ----------

// ---------- Earth ----------

const streakGeo = new THREE.BufferGeometry(); const SK = 1500; const skBase = new Float32Array(SK * 3); { const r = rnd(5); for (let i = 0; i < SK; i++) { skBase.set([(r() - 0.5) * 400, (r() - 0.5) * 400, (r() - 0.5) * 400], i * 3); } }

const andro = galaxy(26000, 1, 1.6), mway = galaxy(18000, 2, 1.25); andro.rotation.set(1.35, 0.35, 0); mway.rotation.set(1.05, 0, 0); andro.position.set(1.6, 0, 3.6); mway.position.set(-1.3, 0, -1.2); scene.add(andro, mway);
const beamGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]); const beam = new THREE.Line(beamGeo, new THREE.LineBasicMaterial({color: 0xaee0ff, transparent: true, blending: THREE.AdditiveBlending})); scene.add(beam);

// ---------- helpers ----------

};
window.renderFrame = (j) => { if (j.er !== undefined) window.ER = j.er; pulse.scale.setScalar(1); const info = SCENES[j.scene](j.t, j.u) || {}; renderer.render(scene, camera); return {img: renderer.domElement.toDataURL('image/jpeg', 0.92), info}; };
