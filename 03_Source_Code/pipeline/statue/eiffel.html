const banks2 = banks.clone(); banks2.position.y = -950; bridge.add(banks2);
const jointGlow = glow(0xff6a20, 8); jointGlow.position.set(0, 0, 1.5); bridge.add(jointGlow);
const crackTex = ctex(512, 512, (g, w, h) => { const r = rnd(70); g.clearRect(0, 0, w, h); g.strokeStyle = 'rgba(15,12,10,0.95)'; g.lineCap = 'round';
  for (let k = 0; k < 10; k++) { let x = w / 2, y = h / 2 + (r() - 0.5) * h * 0.8, a = (r() < .5 ? 0 : Math.PI) + (r() - 0.5); g.lineWidth = 5; g.beginPath(); g.moveTo(x, y); for (let s = 0; s < 10; s++) { a += (r() - 0.5) * 0.8; x += Math.cos(a) * 22; y += Math.sin(a) * 22; g.lineTo(x, y); } g.stroke(); } });
const cracks = new THREE.Mesh(new THREE.PlaneGeometry(10, 14, 20, 1), new THREE.MeshStandardMaterial({map: crackTex, transparent: true, depthWrite: false, roughness: 1}));
cracks.material.onBeforeCompile = (sh) => { Object.assign(sh.uniforms, DU); sh.vertexShader = 'uniform float uK; uniform float uJ;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n float dx = position.x; transformed.z += uK * 2.6 * exp(-dx*dx/18.0) + 0.05;'); };
bridge.add(cracks);

// ---------- sky + lights ----------
const sky = new Sky(); sky.scale.setScalar(40000); scene.add(sky);
const su = sky.material.uniforms; if (su.up) su.up.value.set(0, 0, 1);
const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x4a3a28, 0.55); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 2.8); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.05; key.shadow.radius = 3; scene.add(key); scene.add(key.target);
const sunV = new THREE.Vector3();
function sun(az, el, I = 2.8, col = 0xfff2dc, tgt = [0, 0, 100], size = 260, turb = 3, ray = 1.2) {
  const a = az * Math.PI / 180, e = el * Math.PI / 180; sunV.set(Math.cos(e) * Math.cos(a), Math.cos(e) * Math.sin(a), Math.sin(e));
  su.sunPosition.value.copy(sunV); su.turbidity.value = turb; su.rayleigh.value = ray; su.mieCoefficient.value = 0.004; su.mieDirectionalG.value = 0.85;
  key.color.set(col); key.intensity = I; key.target.position.set(...tgt); key.position.set(tgt[0] + sunV.x * 900, tgt[1] + sunV.y * 900, tgt[2] + sunV.z * 900);
  Object.assign(key.shadow.camera, {left: -size, right: size, top: size, bottom: -size, near: 10, far: 3000}); key.shadow.camera.updateProjectionMatrix(); U.uHot.value.copy(sunV); }
const ALL = [tower, ground, plaza, water, trees, city, snow, snowGround, bar0, bar1, trail, tipGlow, trailDots, bridge, sky, sparkles];
function only(list) { for (const o of ALL) o.visible = list.includes(o); scene.fog = null; renderer.toneMappingExposure = 0.55; hemi.intensity = 0.55; hemi.color.set(0xdfe8ff);
  U.uS.value = 1; U.uBend.value.set(0, 0); U.uCut.value = 1e5; U.uHeat.value = 0; DU.uK.value = 0; scene.background = null; }
const PARIS = [tower, ground, plaza, water, trees, city, sky];
const proj = (p) => { const v = new THREE.Vector3(...p).project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
const tipW = () => { const s = U.uS.value; return [U.uBend.value.x * 1.21, U.uBend.value.y * 1.21, 330 * s]; };
function haze(col, near, far) { scene.fog = new THREE.Fog(col, near, far); }

const SCENES = {
  intro(t, u) { only(PARIS); sun(-150, 24, 3.0, 0xffe2b8); haze(0xd9c9b4, 800, 5200);
    setCam(sph(lerp(820, 700, ease(u)), -125 + t * 2.2, 9, [0, 0, 150]), [0, 0, 165], 40); return {}; },
  build(t, u) { only(PARIS); sun(-140, 30, 3.0, 0xffe8c8); haze(0xd9cdbc, 800, 5200);
    const h = 330 * ease(prog(u, 0.05, 0.75)); U.uCut.value = h;
    setCam(sph(760, -110 + t * 1.5, 10, [0, 0, 150]), [0, 0, 165], 40); return {top: [...proj([0, 0, Math.max(h, 30)]), 0]}; },
  steel(t, u) { only(PARIS); sun(-160, 55, 3.4, 0xfff0d0, [40, 40, 60], 120); haze(0xe0d4c0, 800, 5200); U.uHeat.value = 2.2 * ease(prog(u, 0.15, 0.8)) * (0.85 + 0.15 * Math.sin(t * 6));
    const c = wz(40) - 10; setCam([c + 34, -c - 46 + u * 6, 22], [c - 4, c * 0.2, 64], 46); return {}; },
  hot(t, u) { only([...PARIS, bar0, bar1]); sun(-170, 62, 3.4, 0xfff4e0); haze(0xe6dccb, 800, 5200);
    const k = ease(prog(u, 0.1, 0.7)); U.uS.value = 1 + 0.07 * k; U.uHeat.value = 0.35 * k;
    bar0.position.set(0, 0, 330); bar1.position.set(0, 0, 330 * U.uS.value); bar1.visible = k > 0.02;
    setCam(sph(820, -100 + t * 1.2, 8, [0, 0, 170]), [0, 0, 180], 40); return {dim: [...proj([28, 0, 330 * U.uS.value]), 0]}; },
  cold(t, u) { only([tower, snowGround, city, trees, water, sky, snow, bar0, bar1]); sun(-150, 12, 1.6, 0xd8e6ff, [0, 0, 100], 260, 9, 3); haze(0xc8d4e4, 300, 3200); renderer.toneMappingExposure = 0.5; hemi.color.set(0xcfe0ff); hemi.intensity = 0.9;
    const k = ease(prog(u, 0.1, 0.7)); U.uS.value = 1 - 0.06 * k;
    const p = snowGeo.attributes.position.array; for (let i = 0; i < SN; i++) { p[i * 3] = snowBase[i * 3] + Math.sin(t + i) * 4; p[i * 3 + 1] = snowBase[i * 3 + 1]; p[i * 3 + 2] = ((snowBase[i * 3 + 2] - t * 22) % 400 + 400) % 400; } snowGeo.attributes.position.needsUpdate = true;
    bar0.position.set(0, 0, 330); bar1.position.set(0, 0, 330 * U.uS.value); bar1.visible = k > 0.02;
    setCam(sph(800, -100 + t * 1.2, 8, [0, 0, 170]), [0, 0, 175], 40); return {dim: [...proj([28, 0, 330 * U.uS.value]), 0]}; },
  lean(t, u) { only(PARIS); const az = 180; sun(az, 32, 3.2, 0xffecd0); haze(0xd9cdbc, 800, 5200);
    const k = ease(prog(u, 0.08, 0.6)); U.uBend.value.set(28 * k, 0); U.uHeat.value = 0.4 * k;
    setCam(sph(820, -90, 9, [0, 0, 165]), [0, 0, 175], 40); return {tip: [...proj(tipW()), 0]}; },
  trace(t, u) { only([...PARIS, trail, tipGlow, trailDots]); const day = lerp(0.04, 0.96, u);
    const az = lerp(-100, 100, day) - 180, el = 8 + 52 * Math.sin(Math.PI * day); sun(az, el, 3.0, el < 20 ? 0xffd7a8 : 0xfff2dc); haze(0xd9cdbc, 800, 5200);
    const tipAt = d => { const a = (lerp(-100, 100, d) - 180) * Math.PI / 180, e = Math.sin(Math.PI * d); return [-Math.cos(a) * 20 * (0.5 + 0.5 * e), -Math.sin(a) * 20 * (0.5 + 0.5 * e)]; };
    const b = tipAt(day); U.uBend.value.set(b[0] / 1.21, b[1] / 1.21);
    const p = trailGeo.attributes.position.array; for (let i = 0; i < TR; i++) { const d = lerp(0.04, day, i / (TR - 1)); const q = tipAt(d); p.set([q[0], q[1], 330.5], i * 3); }
    trailGeo.attributes.position.needsUpdate = true; tipGlow.position.set(b[0], b[1], 330);
    trailDots.children.forEach((g, i) => { const d = lerp(0.04, day, i / 59); const q = tipAt(d); g.position.set(q[0], q[1], 330.5); });
    setCam(sph(230, -60 + t * 1.5, 38, [0, 0, 300]), [0, 0, 300], 42); return {tip: [...proj([b[0], b[1], 330]), 0]}; },
  gap(t, u) { only([bridge, sky]); sun(-140, 28, 3.0, 0xffe2bc, [0, 0, 0], 30); haze(0xd0c6b8, 200, 2400); fingers.visible = true; cracks.visible = false; jointGlow.visible = false; deckA.visible = deckB.visible = true;
    setCam([lerp(-8.5, -6.5, ease(u)), -5.6 + t * 0.03, 3.6], [0.6, -2.6, -0.4], 42); return {gap: [...proj([0, -2.2, 0.3]), 0]}; },
  buckle(t, u) { only([bridge, sky]); sun(-160, 58, 3.6, 0xfff0d8, [0, 0, 0], 30); haze(0xe0d6c6, 200, 2400); fingers.visible = false; cracks.visible = true;
    const k = ease(prog(u, 0.1, 0.65)); DU.uK.value = k; jointGlow.visible = true; jointGlow.material.opacity = 0.9 * k; jointGlow.position.z = 2.6 * k + 0.8; jointGlow.scale.setScalar(6 + 4 * k);
    cracks.material.opacity = k;
    setCam(sph(lerp(30, 24, ease(u)), -120 + t * 2, 14, [0, 0, 1]), [0, 0, 1.2], 40); return {joint: [...proj([0, 0, 2.6 * k + 0.5]), 0]}; },
  outro(t, u) { only([...PARIS, sparkles]); sun(-160, 3, 2.0, 0xffb070, [0, 0, 100], 260, 6, 2.5); haze(0xb48a74, 700, 4800); renderer.toneMappingExposure = 0.5;
    sparkles.children.forEach(g => { const v = Math.pow(Math.max(0, Math.sin(t * 9 + g.userData.ph)), 18); g.material.opacity = v; g.scale.setScalar(2 + 6 * v); });
    setCam(sph(760, -135 + t * 2.5, 10, [0, 0, 150]), [0, 0, 165], 40); return {}; },
};
window.renderFrame = (j) => { const info = SCENES[j.scene](j.t, j.u) || {}; renderer.render(scene, camera); return {img: renderer.domElement.toDataURL('image/jpeg', 0.92), info}; };
window.ready = true;
</script></body></html>
