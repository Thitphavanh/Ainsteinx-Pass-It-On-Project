const W = 1080, H = 1920, BW = 540, BH = 960;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});

const lerp = (a, b, k) => a + (b - a) * k, ease = x => x * x * (3 - 2 * x), clamp = x => Math.max(0, Math.min(1, x)), prog = (u, a, b) => clamp((u - a) / (b - a));

const sph = (r, yaw, pitch, c = [0, 0, 0]) => { const a = yaw * Math.PI / 180, b = pitch * Math.PI / 180; return [c[0] + r * Math.cos(b) * Math.cos(a), c[1] + r * Math.cos(b) * Math.sin(a), c[2] + r * Math.sin(b)]; };

const glowTex = ctex(256, 256, (g, w, h) => { const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,0.55)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.12)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });

// ================= black hole + sky: ray-traced (Schwarzschild photon paths) at half res =================
const bhRT = new THREE.WebGLRenderTarget(BW, BH, {type: THREE.HalfFloatType}); bhRT.texture.colorSpace = THREE.LinearSRGBColorSpace;
const bhU = {camPos: {value: new THREE.Vector3()}, projInv: {value: new THREE.Matrix4()}, camWorld: {value: new THREE.Matrix4()}, bhPos: {value: new THREE.Vector3()}, rs: {value: 1}, on: {value: 1},

  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',

    vec3 o = vec3(h1(c+1.7), h1(c+3.1), h1(c+5.3)); vec3 q = p - c - (0.25 + 0.5*o); float b = exp(-dot(q,q)*90.);

// ---------- Earth ----------

// ---------- stars (sun / red giant) ----------
function starTex(seed, base, hot, cool) { return ctex(1024, 512, (g, w, h) => { const r = rnd(seed); g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40000; i++) { const v = r(); g.fillStyle = v < 0.5 ? hot(r) : cool(r); const s = 2 + r() * 7; g.beginPath(); g.arc(r() * w, r() * h, s, 0, 7); g.fill(); } }); }
const sunTex = starTex(22, '#ffb347', r => `rgba(255,${200 + Math.floor(r() * 55)},120,0.35)`, r => `rgba(220,${90 + Math.floor(r() * 50)},20,0.3)`);
const redTex = starTex(31, '#c8401c', r => `rgba(255,${120 + Math.floor(r() * 60)},60,0.35)`, r => `rgba(120,${20 + Math.floor(r() * 30)},10,0.35)`);
const starVS = 'varying vec2 vUv; varying vec3 vN; varying vec3 vP; void main(){ vUv = uv; vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.); vP = mv.xyz; gl_Position = projectionMatrix*mv; }';

  ball.rotation.x = Math.PI / 2; g.add(ball); const a = glow(c1, 5.5, 0.9), b = glow(c2, 3.0, 0.9), c = glow(c3, 11, 0.45); g.add(a, b, c); g.userData = {ball, glows: [a, b, c]}; scene.add(g); return g; }
const sunG = makeStar(sunTex, 0xffa040, 0xffe0a0, 0xff7020); sunG.userData.glows.forEach((g, i) => { g.material.opacity = [0.5, 0.7, 0.12][i]; g.scale.multiplyScalar([0.6, 0.8, 0.45][i]); });

// ---------- supernova shell ----------
const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 96), new THREE.ShaderMaterial({transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, uniforms: {o: {value: 1}, t: {value: 0}},
  vertexShader: 'varying vec3 vN; varying vec3 vP; varying vec3 vO; void main(){ vO = position; vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.); vP = mv.xyz; gl_Position = projectionMatrix*mv; }',
  fragmentShader: `uniform float o, t; varying vec3 vN; varying vec3 vP; varying vec3 vO;
   float h1(vec3 p){ p = fract(p*vec3(443.897,441.423,437.195)); p += dot(p, p.yzx+19.19); return fract((p.x+p.y)*p.z); }
   float n3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(mix(h1(i),h1(i+vec3(1,0,0)),f.x),mix(h1(i+vec3(0,1,0)),h1(i+vec3(1,1,0)),f.x),f.y),mix(mix(h1(i+vec3(0,0,1)),h1(i+vec3(1,0,1)),f.x),mix(h1(i+vec3(0,1,1)),h1(i+vec3(1,1,1)),f.x),f.y),f.z); }

// ---------- light pulse + trail ----------
const TN = 240;
function makeTrail(color) { const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TN * 3), 3)); geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(TN * 3), 3));
  const ln = new THREE.Line(geo, new THREE.LineBasicMaterial({vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false}));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({map: glowTex, size: 0.08, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false}));
  const head = new THREE.Group(); head.add(glow(0xffffff, 0.25), glow(color, 0.9, 0.9)); const g = new THREE.Group(); g.add(ln, pts, head); scene.add(g);
  g.userData.set = (f, s0, s1, size, col = [0.55, 0.82, 1.0], hs = 1) => { const p = geo.attributes.position.array, c = geo.attributes.color.array;

    geo.attributes.position.needsUpdate = geo.attributes.color.needsUpdate = true; pts.material.size = size; head.position.set(...f(s1)); head.scale.setScalar(hs); };
  return g; }

// ---------- rocket ----------
const rocket = new THREE.Group(); scene.add(rocket);
{ const white = new THREE.MeshStandardMaterial({color: 0xf0f0ec, roughness: 0.35, metalness: 0.15}), dark = new THREE.MeshStandardMaterial({color: 0x2a2c30, roughness: 0.5, metalness: 0.5}), orange = new THREE.MeshStandardMaterial({color: 0xd8642a, roughness: 0.5});
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.1, 32), white); body.position.y = 0; rocket.add(body);
  const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.101, 0.101, 0.35, 32), orange); tank.position.y = -0.25; rocket.add(tank);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.32, 32), white); nose.position.y = 0.71; rocket.add(nose);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.102, 0.102, 0.04, 32), dark); band.position.y = 0.3; rocket.add(band);

  const bell = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.1, 24, 1, true), dark); bell.position.y = -0.6; rocket.add(bell);
  const fl1 = glow(0xffc070, 0.55, 1), fl2 = glow(0xff7a30, 1.1, 0.8), fl3 = glow(0xffffff, 0.22, 1); fl1.position.y = -0.78; fl2.position.y = -0.95; fl3.position.y = -0.68; rocket.add(fl1, fl2, fl3); }

// ---------- rock (spaghettification) ----------
const rockGeo = new THREE.IcosahedronGeometry(1, 5); { const p = rockGeo.attributes.position, r = rnd(77); const v = new THREE.Vector3(); const bumps = []; for (let i = 0; i < 14; i++) bumps.push([new THREE.Vector3(r() - 0.5, r() - 0.5, r() - 0.5).normalize(), 0.15 + r() * 0.3, (r() - 0.5) * 0.25]);

const rock = new THREE.Mesh(rockGeo, new THREE.MeshStandardMaterial({map: rockTex, roughness: 0.95, bumpMap: rockTex, bumpScale: 2})); const rockG = new THREE.Group(); rockG.add(rock); scene.add(rockG);

// ---------- horizon ring ----------
const ringPts = []; for (let i = 0; i <= 256; i++) { const a = i / 256 * Math.PI * 2; ringPts.push(new THREE.Vector3(Math.cos(a), Math.sin(a), 0)); }

// ---------- galaxy ----------
function galaxy(n, seed, r0) { const r = rnd(seed), p = [], c = []; const g = () => { let s = 0; for (let i = 0; i < 6; i++) s += r(); return (s - 3) / 1.4; };

  const pts = new THREE.Points(geo, new THREE.PointsMaterial({map: glowTex, size: 0.06 * r0, vertexColors: true, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false}));
  const grp = new THREE.Group(); grp.add(pts); grp.add(glow(0xffd8a0, r0 * 0.7, 0.6)); grp.add(glow(0xfff0d0, r0 * 0.2, 0.9)); return grp; }
const mway = galaxy(60000, 2, 1.6); scene.add(mway);
const pinSun = glow(0x9fe0ff, 0.06, 1), pinBH = glow(0xffa040, 0.06, 1); scene.add(pinSun, pinBH);

window.renderFrame = (j) => { const info = SCENES[j.scene](j.t, j.u) || {}; bhU.t.value = j.t; bhU.camPos.value.copy(camera.position); bhU.projInv.value.copy(camera.projectionMatrixInverse); bhU.camWorld.value.copy(camera.matrixWorld);
