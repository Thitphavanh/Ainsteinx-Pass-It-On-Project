function setCam(pos, target, fov = 35) { camera.position.set(...pos); camera.lookAt(new THREE.Vector3(...target)); camera.fov = fov; camera.updateProjectionMatrix(); }

  Object.assign(key.shadow.camera, {left: -size, right: size, top: size, bottom: -size}); key.shadow.camera.updateProjectionMatrix(); }
const sph = (r, yaw, pitch) => { const a = yaw * Math.PI / 180, b = pitch * Math.PI / 180; return [r * Math.cos(b) * Math.cos(a), r * Math.sin(b) * 0 + r * Math.cos(b) * Math.sin(a), r * Math.sin(b)]; };
const lerp = (a, b, k) => a + (b - a) * k; const ease = (x) => x * x * (3 - 2 * x); const clamp = (x) => Math.max(0, Math.min(1, x));

function only(list) {
  for (const o of [desk, orni, chute, heart, sky, ground, clouds]) o.visible = list.includes(o);
  scene.fog = null; scene.background = null; scene.environment = envRoom; renderer.toneMappingExposure = 1.0; candleLight.visible = true;
}
function workshopLight(tt) { only([desk]); scene.background = new THREE.Color(0x120c09); hemi.intensity = 0.6; key.intensity = 2.6; keyAt([0, 0, 0], [-0.5, -0.45, 0.75], 3.5);
  rim.position.set(3, 4, 3); rim.intensity = 0.6; candleLight.intensity = 2.6 + 0.4 * Math.sin(tt * 13) * Math.sin(tt * 7.3); flame.scale.set(0.09, 0.17 + 0.02 * Math.sin(tt * 11), 1); }

const SCENES = {
  notebook(t, u) {
    workshopLight(t); book.rotation.z = 0; book.position.set(0, 0, 0);
    orniModel.visible = chuteModel.visible = stand.visible = false;
    const f = (t * 0.45) % 1; turnPivot.rotation.y = -Math.PI * ease(clamp(f * 1.4)); pageT.visible = true;
    const yaw = -90 + 16 * Math.sin(t * 0.25), d = lerp(4.6, 4.0, ease(u));
    setCam(sph(d, yaw, 56), [0, 0.15, 0], 48);
  },
  mirror(t, u) {
    workshopLight(t); orniModel.visible = chuteModel.visible = stand.visible = false;
    turnPivot.rotation.y = 0; pageT.visible = true;
    setCam([0.5 + 0.08 * Math.sin(t * 0.3), -1.2, 1.7], [0.45, -0.05, 0.05], 44);
  },
  heart(t, u) {
    workshopLight(t); orniModel.visible = chuteModel.visible = stand.visible = false; heart.visible = true;
    scene.background = new THREE.Color(0x0e0807);
    const beat = 1 + 0.06 * Math.pow(Math.max(0, Math.sin(t * Math.PI * 2 * 1.1)), 4);
    heart.scale.setScalar(0.42 * beat); heart.position.set(0.1, -0.1, 0.75 + 0.03 * Math.sin(t)); heart.rotation.z = t * 0.35;
    keyAt([0, 0, 0.7], [-0.6, -0.5, 0.6], 2); rim.position.set(2, 3, 2); rim.intensity = 1.4;
    setCam(sph(3.2, -80 + 10 * Math.sin(t * 0.4), 18).map((v, i) => v + [0, 0, 0.7][i]), [0.05, 0, 0.62], 42);
  },
  flight(t, u) {
    only([orni, sky, ground, clouds]); scene.environment = null; hemi.intensity = 0.9; key.intensity = 2.8;
    su.sunPosition.value.set(-0.5, 0.6, 0.45);
    scene.fog = new THREE.Fog(0x9fbbe0, 600, 4000); ground.position.z = -600; su.rayleigh.value = 2.2; su.turbidity.value = 2.5;
    orni.position.set(t * 0.0, 0, 0.15 * Math.sin(t * 2)); orni.rotation.set(0.05 * Math.sin(t), 0.06 * Math.sin(t * 0.7), 0); orni.userData.flap(t);
    for (const c of clouds.children) { c.position.x = ((c.userData.base.x - t * 9 + 200) % 400 + 400) % 400 - 200; c.position.y = c.userData.base.y; c.position.z = c.userData.base.z - 40; }
    keyAt([0, 0, 0], [0.3, -0.4, 0.85], 5); rim.position.set(-3, 3, 2); rim.intensity = 0.6;
    setCam(sph(12, 185 + 10 * Math.sin(t * 0.5), 15), [0.2, 0, -0.4], 38);
  },
  parachute(t, u) {
    only([chute, sky, ground, clouds]); scene.environment = null; hemi.intensity = 0.9; key.intensity = 2.6;
    su.sunPosition.value.set(-0.3, 0.6, 0.35); su.rayleigh.value = 2.2; su.turbidity.value = 2.5;
    scene.fog = new THREE.Fog(0xbcd0e6, 200, 2200); ground.position.z = lerp(-900, -380, u);
    chute.position.set(0, 0, 0.2 * Math.sin(t * 1.2)); chute.rotation.set(0.05 * Math.sin(t * 1.1), 0.04 * Math.sin(t * 0.9), t * 0.15);
    for (const c of clouds.children) { c.position.x = c.userData.base.x * 0.5; c.position.y = c.userData.base.y * 0.5 + 60; c.position.z = ((c.userData.base.z + t * 7 + 60) % 120 + 120) % 120 - 60; }
    keyAt([0, 0, 0], [-0.4, -0.5, 0.75], 5); rim.position.set(3, 3, 1); rim.intensity = 0.5;
    setCam(sph(12.5, -55 + 15 * Math.sin(t * 0.5), -8), [0, 0, 0.3], 40);
  },
  hero(t, u) {
    workshopLight(t); orniModel.visible = chuteModel.visible = stand.visible = true;
    turnPivot.rotation.y = -Math.PI * ease(clamp(((t * 0.3) % 1) * 1.3));
    orniModel.position.set(-0.95, 0.75, 0.95); orniModel.userData.flap(t, 0.7); stand.position.set(-0.95, 0.75, 0.2); stand.scale.set(1, 1, 1);
    chuteModel.position.set(1.05, 0.7, 0.5 + 0.03 * Math.sin(t)); chuteModel.rotation.z = t * 0.3;
    gears.children[0].rotation.z = t * 0.5; gears.children[1].rotation.z = -t * 0.5 * 1.6;
    setCam(sph(4.3, -90 + 18 * Math.sin(t * 0.22), 22).map((v, i) => v + [0, 0.2, 0.4][i]), [0, 0.35, 0.45], 50);
  },
};
window.renderFrame = (j) => { SCENES[j.scene](j.t, j.u); renderer.render(scene, camera); return renderer.domElement.toDataURL('image/jpeg', 0.92); };
window.ready = true;
</script></body></html>
