    const on = prog(u, 0.1, 0.4); packets.forEach(([p, a, b, ph]) => { const k = (t * 0.45 + ph) % 1; const A = laps[a].position, B = laps[b].position; const P = A.clone().lerp(B, k); P.z += Math.sin(k * Math.PI) * 0.9 + 0.2; p.position.copy(P); p.material.opacity = on * Math.sin(k * Math.PI); });
    laps.forEach((L, i) => { L.position.z = (i % 3) * 0.25 + 0.05 * Math.sin(t * 1.5 + i); });
    setCam(sph(lerp(7.8, 6.6, ease(u)), -100 + 20 * u, 30, [0, 0, 0.3]), [0, 0, 0.35], 40); return {}; },
  outro(t, u) { const r = SCENES.hero(t, u); setCam(sph(4.6, -84 + 12 * u, 20, [0.0, 0.1, 0.42]), [0.0, 0.15, 0.45], 40); dof(0.002); return r; },
};
window.renderFrame = (j) => { const info = SCENES[j.scene](j.t, j.u) || {}; composer.render(); return {img: renderer.domElement.toDataURL('image/jpeg', 0.92), info}; };
window.ready = true;
